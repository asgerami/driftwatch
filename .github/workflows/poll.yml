# The scheduled pipeline: fetch every active source's current spec, store it if
# the normalized surface changed, and diff consecutive versions. Nothing here
# publishes; changes wait for `pnpm w review --publish`.
#
# Runs on a fresh runner each time. Postgres is Neon and spec blobs are R2, so
# nothing that matters lives on the runner's disk. Git clones are cached
# between runs only to save time; losing the cache costs a minute, not data.

name: poll

on:
  schedule:
    # Every 6 hours, off the top of the hour when GitHub's scheduler is busiest.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Provider slug or source (e.g. stripe, twilio/messaging_v1). Empty for all."
        required: false
        default: ""
      backfill:
        description: "Also import this many past versions per source (e.g. 20 for newly added APIs). 0 for none."
        required: false
        default: "0"

# Two overlapping runs would race on the same snapshot rows.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read
  # The review-queue issue: opened when something needs a person, closed when not.
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      R2_BASE_URL: ${{ secrets.R2_BASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # No GITHUB_TOKEN: the provider repos are public, and a token would be
      # written into the cached clones' remote URL and be expired by next run.
      TARGET: ${{ inputs.target }}
      BACKFILL: ${{ inputs.backfill || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Also builds packages/core via its prepare script.
      - run: pnpm install --frozen-lockfile

      - run: pnpm generate

      - name: Restore provider clones
        uses: actions/cache@v4
        with:
          path: .data/repos
          key: repos-${{ github.run_id }}
          restore-keys: repos-

      # Idempotent upsert of the registry, so adding an API is a merge, not a
      # manual step against production.
      - name: Seed
        run: pnpm w seed

      - name: Poll
        run: pnpm w poll $TARGET

      - name: Backfill
        if: env.BACKFILL != '0'
        run: pnpm w backfill $TARGET -n "$BACKFILL"

      - name: Diff
        run: pnpm w diff $TARGET

      - name: Status
        if: always()
        run: pnpm w status

      # One open issue, labelled review-queue, lists stories waiting for review
      # and sources not fetching. A new issue notifies; so does a comment when
      # the counts in its title change. Editing the body alone would not, and a
      # queue nobody is told about grows forever.
      - name: Review-queue issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm w report --out report.md
          number=$(gh issue list --label review-queue --state open --json number --jq '.[0].number // empty')
          if [ -s report.md ]; then
            title=$(cat report.md.title)
            if [ -n "$number" ]; then
              old=$(gh issue view "$number" --json title --jq .title)
              gh issue edit "$number" --title "$title" --body-file report.md
              if [ "$old" != "$title" ]; then gh issue comment "$number" --body "$title"; fi
            else
              gh label create review-queue --color d93f0b --description "Driftwatch needs a person" 2>/dev/null || true
              gh issue create --title "$title" --label review-queue --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing waiting for review and every source is fetching."
          fi
